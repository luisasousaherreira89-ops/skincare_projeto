<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        
        <section id="secaoFormulario">
            <h2 id="tituloTela">CADASTRO DE PRODUTOS</h2>

            <form id="formProduto">
                <div class="linha-form">
                    <div class="esquerda">
                        <label>Código:</label>
                        <input type="text" id="codigo" readonly>

                        <label>Produto:</label>
                        <input type="text" id="produto" placeholder="Nome do produto">

                        <label>Descrição:</label>
                        <textarea id="descricao" placeholder="Descrição do produto"></textarea>

                        <label>Preço: R$</label>
                        <input type="text" id="preco" placeholder="0,00">
                    </div>

                    <div class="direita">
                        <img id="previewFoto" alt="Prévia da imagem">
                        
                        <label>Foto:</label>
                        <input type="text" id="foto" maxlength="10" placeholder="Imagem do produto">
                    </div>
                </div>

                <div class="botoes-acao">
                    <button type="submit" id="btnSalvar" class="btn-verde">Cadastrar Produto</button>
                    <button type="button" id="btnCancelar" class="btn-cinza">Cancelar</button>
                </div>
            </form>
        </section>

    
        <section id="secaoLista">
            <h2>LISTA DE PRODUTOS</h2>
            <div id="tabelaProdutosContainer"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
